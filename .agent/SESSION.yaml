classes:
  Orbit:
    size_kb: 14.7
    elements: [a, e, i, Omega, omega, nu]
    constructors:
      - name: classical
        params: [a, e, i, Omega, omega, nu, mu, epoch]
      - name: stateVector
        params: [position, velocity, mu, epoch]
    methods_public:
      - getPositionAtTime
      - getVelocityAtTime
      - getStateAtTime
      - getPeriod
      - getAltitude
      - getDistanceToPeriapsis
      - isStable
    algorithm_kepler:
      equation: "M = E - e*sin(E)"
      solver: Newton-Raphson
      tolerance: 1e-10
      max_iterations: 100
      convergence_typical: "3-5 iterations"
    precision: double

  CelestialBody:
    size_kb: 7.5
    members: [name, mass, radius, mu, surfaceGravity, atmosphere, orbit, satellites]
    methods: [setOrbit, getPositionAtTime, addSatellite]

  Vessel:
    size_kb: 7.5
    members: [name, dryMass, fuelMass, orbit, currentTime, referenceBody, state]
    methods: [getPosition, getVelocity, getState, applyDeltaV, consumeFuel, printStatus]

  WorldManager:
    size_kb: 8.5
    members: [celestialBodies, vessels, simulationTime, timeWarp, activeVessel, floatingOrigin]
    methods: [registerCelestialBody, registerVessel, updateSimulation, setTimeWarp, setActiveVessel]

  Constants:
    size_kb: 1.5
    defines:
      MU_EARTH: 3.986e14
      KSP_SCALE: 0.1
      KEPLER_TOLERANCE: 1e-10
      KEPLER_MAX_ITERATIONS: 100
    types: [dvec3, dquat, dmat3, dmat4]

physics:
  kepler_equation: "M = E - e*sin(E)"
  solver: Newton-Raphson
  tolerance: 1e-10_rad
  max_iterations: 100
  convergence_typical: "3-5"
  precision: double_throughout
  
  propagation_steps:
    1: "MeanAnomaly: M = n(t - t0), n = sqrt(mu/a^3)"
    2: "SolveKepler: E from M using Newton-Raphson"
    3: "TrueAnomaly: nu from E using arctan2"
    4: "OrbitalPlane: (r,theta) in orbital frame"
    5: "Transform: R_z(Omega)*R_x(i)*R_z(omega) to ECI"

  conversions:
    - "E <-> nu (anomaly)"
    - "stateVector <-> elements"
    - "orbital <-> inertial"

