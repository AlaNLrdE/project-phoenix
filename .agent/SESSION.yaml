classes:
  Orbit:
    size_kb: 14.7
    elements: [a, e, i, Omega, omega, nu]
    constructors:
      - name: classical
        params: [a, e, i, Omega, omega, nu, mu, epoch]
      - name: stateVector
        params: [position, velocity, mu, epoch]
    methods_public:
      - getPositionAtTime
      - getVelocityAtTime
      - getStateAtTime
      - getPeriod
      - getAltitude
      - getDistanceToPeriapsis
      - isStable
    algorithm_kepler:
      equation: "M = E - e*sin(E)"
      solver: Newton-Raphson
      tolerance: 1e-10
      max_iterations: 100
      convergence_typical: "3-5 iterations"
    precision: double

  CelestialBody:
    size_kb: 7.5
    members: [name, mass, radius, mu, surfaceGravity, atmosphere, orbit, satellites]
    methods: [setOrbit, getPositionAtTime, addSatellite]

  Vessel:
    size_kb: 7.5
    members: [name, dryMass, fuelMass, orbit, currentTime, referenceBody, state]
    methods: [getPosition, getVelocity, getState, applyDeltaV, consumeFuel, printStatus]

  WorldManager:
    size_kb: 8.5
    members: [celestialBodies, vessels, simulationTime, timeWarp, activeVessel, floatingOrigin]
    methods: [registerCelestialBody, registerVessel, updateSimulation, setTimeWarp, setActiveVessel]

  LaunchVehicle:
    size_kb: 7.5
    namespace: Phoenix::Launch
    members: [name, stages]
    methods:
      - addStage         # agrega etapa en orden de ignición (booster primero)
      - getStageDeltaV   # Tsiolkovsky por etapa con masa correcta
      - getTotalDeltaV   # suma de todas las etapas
      - getStageTWR      # thrust/weight en ignición de cada etapa
      - getCoMHeight     # CoM sobre la base (modelo de columna)
      - getCoMShiftDuringBurn  # desplazamiento de CoM al quemar propelante
      - assemble         # construye árbol de partes → Vessel
      - printSummary     # tabla de rendimiento ASCII

  StageConfig:
    size_kb: 1.0
    namespace: Phoenix::Launch
    members: [name, engines, tanks, strutMass, decouplerMass, hasDecoupler]
    helpers: [EngineSpec, TankSpec]

  AscentIntegrator:
    size_kb: 8.0
    namespace: Phoenix::Launch
    members: [veh, body, atm, throttle, recordInterval, guidance]
    methods:
      - simulate          # RK4 loop, multi-stage, returns AscentResult
      - setThrottle       # [0,1] throttle
      - setRecordInterval # n pasos entre muestras
      - setGuidance       # GuidanceLaw (pitch program + Max-Q + target apoapsis)
    structs: [AscentPoint, AscentResult]
    integration: RK4
    forces: [thrust, gravity_ECI, atmospheric_drag]
    guidance_8C: "altitude-based pitch 0°→45° (smoothstep hKick→hTurn), prograde tracking above hTurn"

  GuidanceLaw:
    size_kb: 0.5
    namespace: Phoenix::Launch
    members: [hKick, hTurn, maxQLimit, maxQThrottle, targetApoapsis]
    note: "hKick=200m pitch start, hTurn=6000m pitch 45° (prograde), maxQ clamp at 35kPa, targetApo=40km"

  Constants:
    size_kb: 1.5
    defines:
      MU_EARTH: 3.986e14
      KSP_SCALE: 0.1
      G0: 9.81
      KEPLER_TOLERANCE: 1e-10
      KEPLER_MAX_ITERATIONS: 100
    types: [dvec3, dquat, dmat3, dmat4]

namespaces:
  Phoenix::Math: "Constants, Types, Conversions"
  Phoenix::Physics: "Orbit, CelestialBody, Atmosphere, AeroForces"
  Phoenix::Parts: "Part, Engine"
  Phoenix::Vessels: "Vessel"
  Phoenix::World: "WorldManager, SphereOfInfluence"
  Phoenix::UI: "AsciiRenderer, MissionDisplay"
  Phoenix::Launch: "StageConfig, LaunchVehicle, AscentIntegrator, GuidanceLaw"

physics:
  kepler_equation: "M = E - e*sin(E)"
  solver: Newton-Raphson
  tolerance: 1e-10_rad
  max_iterations: 100
  convergence_typical: "3-5"
  precision: double_throughout

  propagation_steps:
    1: "MeanAnomaly: M = n(t - t0), n = sqrt(mu/a^3)"
    2: "SolveKepler: E from M using Newton-Raphson"
    3: "TrueAnomaly: nu from E using arctan2"
    4: "OrbitalPlane: (r,theta) in orbital frame"
    5: "Transform: R_z(Omega)*R_x(i)*R_z(omega) to ECI"

  conversions:
    - "E <-> nu (anomaly)"
    - "stateVector <-> elements"
    - "orbital <-> inertial"

  delta_v:
    equation: "DV = Isp * G0 * ln(m0 / mf)"
    staging: "m0 = wet mass from stage i upward; mf = m0 - propellant_i"

build:
  required:
    compiler: C++20
    cmake: "3.20+"
    glm: header-only
    raylib: "5+ (para demo 3D)"
  compilers: [GCC10+, Clang12+, MSVC2019+]
  flags:
    release: -O3
    debug: "-g -O0"
  executables:
    phoenix:        "main.cpp — ejemplos de consola (fases 1-8)"
    phoenix_3d:     "demo_3d.cpp — visor orbital 3D (Phase 7)"
    phoenix_launch: "demo_launch.cpp — lanzamiento 3D (Phase 8)"
  commands:
    compile: "./build.sh release"
    run: "./build/phoenix"
    run_3d: "./build/phoenix_3d"
    run_launch: "./build/phoenix_launch"
    verify: "python3 check_structure.py"
    git_status: "git status"
    git_log: "git log --oneline"
    git_push: "git push origin master"
    git_pull: "git pull origin master"
    rebuild_clean: "rm -rf build && ./build.sh release"

