  step2: "python3 check_structure.py"
  step3: "./build.sh release"
  step4: "./build/phoenix"
  step5: "Read README.md or ARCHITECTURE.md"

documentation_priority:
  quickstart: "5 min intro"
  main_cpp: "30 min examples"
  readme: "20 min complete guide"
  architecture: "15 min diagrams & algorithms"
  roadmap: "complete phases 2-6"
